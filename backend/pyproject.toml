[project]
name = "traceguard-ai-backend"
version = "0.1.0"
description = "TraceGuard AI - Agentic cybercrime investigation platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "sqlalchemy[asyncio]==2.0.31",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Passlib 1.7.4 is incompatible with bcrypt 5.x backend checks.
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "neo4j==5.22.0",
    "boto3==1.34.140",
    "httpx==0.27.0",
    "langgraph==0.1.5",
    "langchain-core==0.2.11",
    "openai==1.35.7",
    "pypdf==4.3.1",
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "tenacity==8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "httpx==0.27.0",
    "asgi-lifespan==2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
